# Deploy main to the VPS. The images are built HERE (GitHub runner) and pushed to the private GitHub registry; the VPS
# only pulls them and restarts — building on the VPS (next build at ~400 % CPU for minutes) slowed the program for
# everybody during every deploy. The key in DEPLOY_SSH_KEY is restricted on the server to run docker/deploy.sh only;
# the job's short-lived token (read packages) goes to it on stdin, used for the pull and logged out again.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REG: ghcr.io/bajramigroup50-prog

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ env.REG }}/wise-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=wise
          cache-to: type=gha,scope=wise,mode=max
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          push: true
          tags: ${{ env.REG }}/wise-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=wise
            type=gha,scope=wise-worker
          cache-to: type=gha,scope=wise-worker,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH (pull, no build)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo '207.180.254.154 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPqeGMNdNYj383VETrNpx4I6cD+e95pzaD/fAc7nu6sN' > ~/.ssh/known_hosts
          printf '%s\n%s\n%s\n' "$TOKEN" "${{ github.actor }}" "${{ github.sha }}" | ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 wise@207.180.254.154
