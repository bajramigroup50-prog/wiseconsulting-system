# 📱 WISE CONSULTING app for Android and iPhone (Capacitor shell around https://app.wiseconsulting.com.mk, mobile/).
# Android: an installable APK, published on the release „android-app“ (public download link). Signed with the office
#   key when the secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD exist (updates install over each other);
#   without them a debug-signed test build.
# iPhone: compiled for the simulator only (proof that it builds). Installing on iPhones needs an Apple Developer
#   account (signing + TestFlight / App Store) — added when the office has one.
name: Mobile app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Install and sync
        working-directory: mobile
        run: npm ci && npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wise-release.p12"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/wise-release.p12"
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/WISE-CONSULTING.apk"
          else
            echo "::warning::No signing secrets – debug-signed test build"
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/WISE-CONSULTING.apk"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: WISE-CONSULTING-android, path: '${{ runner.temp }}/WISE-CONSULTING.apk' }
      - name: Publish (release „android-app“)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-app >/dev/null 2>&1 || gh release create android-app --title "WISE CONSULTING – Android" --notes "Апликацијата WISE CONSULTING за Android. Преземете ја WISE-CONSULTING.apk на телефонот и отворете ја (дозволете инсталација од овој извор)." --latest=false
          gh release upload android-app "$RUNNER_TEMP/WISE-CONSULTING.apk" --clobber

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and sync
        working-directory: mobile
        run: npm ci && npx cap sync ios
      - name: Build for the simulator (no signing)
        working-directory: mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
