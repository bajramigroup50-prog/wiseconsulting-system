# WISE CONSULTING stack. On the VPS: copy .env.example to .env, fill it in, then
#   docker compose -f docker/compose.yml --env-file /opt/wise/.env up -d --build
# Postgres and the S3 store (SeaweedFS) are not published; files are reached only via presigned URLs on files.DOMAIN.
name: wise

x-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_URL: https://files.${DOMAIN}
  S3_BUCKET: ${S3_BUCKET:-wise-docs}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  TZ: Europe/Skopje

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Unicode-aware case mapping (ILIKE/lower on Cyrillic) without depending on the image's glibc locales.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
      TZ: Europe/Skopje
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  s3:
    # S3-compatible object storage (SeaweedFS). MinIO stopped publishing images in 2025.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"wise","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip=s3 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -s3.allowedOrigins=https://${DOMAIN}
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      retries: 30

  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on: { s3: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name ${S3_BUCKET:-wise-docs}" | weed shell -master=s3:9333 || true
    restart: "no"

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    image: wise-worker
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      <<: *app-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_MUST_CHANGE_PASSWORD: ${ADMIN_MUST_CHANGE_PASSWORD:-0}
    command: ["sh", "-c", "pnpm --filter @wise/db migrate && pnpm --filter @wise/db seed"]
    restart: "no"

  app:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    image: wise-web
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
    environment: *app-env

  worker:
    image: wise-worker
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment: *app-env

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app, s3]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}", IP_HOST: "${IP_HOST:-localhost}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../legacy:/srv/klasik:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  s3data:
  caddydata:
  caddyconfig:
