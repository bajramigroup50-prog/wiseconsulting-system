# WISE CONSULTING stack. On the VPS: copy .env.example to .env, fill it in, then
#   docker compose -f docker/compose.yml --env-file docker/.env up -d --build
# Postgres and MinIO are not published; the MinIO console is reachable only via SSH tunnel (127.0.0.1:9001).
name: wise

x-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_URL: https://files.${DOMAIN}
  S3_BUCKET: ${S3_BUCKET:-wise-docs}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  TZ: Europe/Skopje

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Unicode-aware case mapping (ILIKE/lower on Cyrillic) without depending on the image's glibc locales.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
      TZ: Europe/Skopje
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  minio:
    # MinIO no longer publishes to Docker Hub; confirm this tag exists on quay.io before the first deploy.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set w http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing w/${S3_BUCKET:-wise-docs} && mc anonymous set none w/${S3_BUCKET:-wise-docs}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    image: wise-worker
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      <<: *app-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["sh", "-c", "pnpm --filter @wise/db migrate && pnpm --filter @wise/db seed"]
    restart: "no"

  app:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    image: wise-web
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment: *app-env

  worker:
    image: wise-worker
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment: *app-env

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app, minio]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
